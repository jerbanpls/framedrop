<!doctype html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FrameDrop</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    .pt-safe { padding-top: env(safe-area-inset-top); }
  </style>
</head>
<body class="h-full text-slate-100 antialiased" x-data="frameDrop()" x-init="init()">

  <!-- Header / frame status -->
  <header class="pt-safe sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="16" cy="8.5" r="1.5"/></svg>
        <span class="font-semibold tracking-tight">FrameDrop</span>
      </div>
      <button @click="refreshStatus()" class="flex items-center gap-2 rounded-full bg-slate-900 border border-slate-800 px-3 py-1.5 text-xs">
        <span class="relative flex w-2.5 h-2.5">
          <span x-show="status.frame_reachable" class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-60 animate-ping"></span>
          <span class="relative inline-flex w-2.5 h-2.5 rounded-full"
                :class="status.frame_reachable === null ? 'bg-slate-500' : (status.frame_reachable ? 'bg-emerald-400' : 'bg-rose-500')"></span>
        </span>
        <span x-text="status.frame_reachable === null ? 'Checking…' : (status.frame_reachable ? 'Frame online' : 'Frame offline')"></span>
        <span class="text-slate-500 hidden sm:inline" x-show="status.width" x-text="`${status.width}×${status.height}`"></span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-4 pb-28">

    <!-- Upload tab -->
    <section x-show="tab === 'upload'" x-cloak class="space-y-4">
      <label
        class="block cursor-pointer rounded-2xl border-2 border-dashed transition p-8 sm:p-12 text-center"
        :class="dragging ? 'border-sky-400 bg-sky-400/10' : 'border-slate-700 bg-slate-900/60 active:bg-slate-900'"
        @dragover.prevent="dragging = true"
        @dragleave.prevent="dragging = false"
        @drop.prevent="dragging = false; addFiles($event.dataTransfer.files)">
        <input type="file" class="hidden" multiple accept="image/*,.heic,.heif" x-ref="picker"
               @change="addFiles($event.target.files); $event.target.value = ''">
        <div class="mx-auto w-16 h-16 rounded-full bg-sky-500/15 grid place-items-center mb-4">
          <svg class="w-8 h-8 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        </div>
        <p class="text-lg font-medium">Tap to choose photos</p>
        <p class="text-sm text-slate-400 mt-1">or drag &amp; drop · JPG, PNG, WEBP, HEIC</p>
      </label>

      <!-- Resize mode -->
      <div class="rounded-2xl bg-slate-900 border border-slate-800 p-1 grid grid-cols-2 gap-1 text-sm">
        <button @click="mode = 'blur'" class="rounded-xl py-3 px-2 transition"
                :class="mode === 'blur' ? 'bg-sky-500 text-white font-medium' : 'text-slate-300'">
          Blur-fill portrait photos
        </button>
        <button @click="mode = 'crop'" class="rounded-xl py-3 px-2 transition"
                :class="mode === 'crop' ? 'bg-sky-500 text-white font-medium' : 'text-slate-300'">
          Crop to fill
        </button>
      </div>
      <p class="text-xs text-slate-500 px-1"
         x-text="mode === 'blur' ? 'Whole photo stays visible; empty space is filled with a blurred copy.' : 'Photo fills the screen; edges that don\'t fit are trimmed.'"></p>

      <!-- Queue -->
      <div x-show="queue.length" x-cloak class="rounded-2xl bg-slate-900 border border-slate-800 overflow-hidden">
        <div class="p-4 space-y-2">
          <div class="flex items-center justify-between text-sm">
            <span x-text="busy ? `Uploading ${doneCount + 1 > queue.length ? queue.length : doneCount + 1} of ${queue.length}…` : `${doneCount} of ${queue.length} done`"></span>
            <button x-show="!busy" @click="queue = []" class="text-slate-400 text-xs underline">Clear</button>
          </div>
          <div class="h-2 rounded-full bg-slate-800 overflow-hidden">
            <div class="h-full bg-sky-500 transition-all duration-300" :style="`width: ${overallProgress}%`"></div>
          </div>
        </div>
        <ul class="divide-y divide-slate-800 max-h-80 overflow-y-auto">
          <template x-for="item in queue" :key="item.id">
            <li class="px-4 py-2.5 flex items-center gap-3 text-sm">
              <span class="w-5 shrink-0 text-center" x-html="stateIcon(item.state)"></span>
              <div class="min-w-0 flex-1">
                <p class="truncate" x-text="item.file.name"></p>
                <p class="text-xs" :class="item.state === 'error' ? 'text-rose-400' : 'text-slate-500'" x-text="item.message"></p>
              </div>
              <span class="text-xs text-slate-500 tabular-nums" x-show="item.state === 'uploading'" x-text="`${Math.round(item.progress * 100)}%`"></span>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- Gallery tab -->
    <section x-show="tab === 'gallery'" x-cloak class="space-y-4">
      <div class="flex flex-wrap items-center gap-2">
        <h2 class="text-lg font-semibold mr-auto">
          <span x-text="photos.length"></span> <span x-text="photos.length === 1 ? 'photo' : 'photos'"></span>
        </h2>
        <button @click="syncRepair()" :disabled="syncing" class="rounded-full bg-slate-900 border border-slate-800 px-3 py-1.5 text-sm disabled:opacity-50">
          <span x-text="syncing ? 'Syncing…' : 'Sync / Repair'"></span>
        </button>
        <button x-show="status.immich_enabled" x-cloak @click="immichSync()" :disabled="immichSyncing" class="rounded-full bg-slate-900 border border-slate-800 px-3 py-1.5 text-sm disabled:opacity-50">
          <span x-text="immichSyncing ? 'Pulling…' : 'Immich'"></span>
        </button>
        <button @click="toggleSelect()" class="rounded-full px-3 py-1.5 text-sm border"
                :class="selecting ? 'bg-sky-500 border-sky-500 text-white' : 'bg-slate-900 border-slate-800'"
                x-text="selecting ? 'Done' : 'Select'"></button>
      </div>

      <div x-show="loadingPhotos && !photos.length" class="text-center text-slate-500 py-16">Loading…</div>
      <div x-show="!loadingPhotos && !photos.length" x-cloak class="text-center text-slate-500 py-16">
        No photos yet. <button class="text-sky-400 underline" @click="tab = 'upload'">Upload some</button>.
      </div>

      <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-1.5">
        <template x-for="p in photos" :key="p.name">
          <div class="relative aspect-square rounded-lg overflow-hidden bg-slate-900 group"
               @click="selecting ? toggle(p.name) : (lightbox = p)">
            <img :src="p.thumb" loading="lazy" class="w-full h-full object-cover transition"
                 :class="selecting && selected.includes(p.name) ? 'scale-90 rounded-lg' : ''" alt="">
            <span x-show="p.on_frame === false" title="Not on frame — run Sync / Repair"
                  class="absolute top-1.5 left-1.5 w-2.5 h-2.5 rounded-full bg-amber-400 ring-2 ring-slate-950"></span>
            <div x-show="selecting" class="absolute top-1.5 right-1.5 w-6 h-6 rounded-full border-2 grid place-items-center"
                 :class="selected.includes(p.name) ? 'bg-sky-500 border-sky-500' : 'border-white/80 bg-black/30'">
              <svg x-show="selected.includes(p.name)" class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <button x-show="!selecting" @click.stop="deletePhotos([p.name])" aria-label="Delete"
                    class="absolute bottom-1.5 right-1.5 w-8 h-8 rounded-full bg-black/55 grid place-items-center sm:opacity-0 sm:group-hover:opacity-100 transition">
              <svg class="w-4 h-4 text-rose-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 002 2h8a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>
            </button>
          </div>
        </template>
      </div>
    </section>
  </main>

  <!-- Selection action bar -->
  <div x-show="selecting && selected.length" x-cloak x-transition.opacity
       class="fixed inset-x-0 bottom-20 z-30 px-4 pb-safe">
    <div class="max-w-md mx-auto flex items-center gap-2 rounded-2xl bg-slate-800 border border-slate-700 p-2 shadow-xl">
      <span class="px-2 text-sm flex-1" x-text="`${selected.length} selected`"></span>
      <button @click="selected = photos.map(p => p.name)" class="text-sm px-3 py-2 text-slate-300">All</button>
      <button @click="deletePhotos(selected)" class="rounded-xl bg-rose-600 px-4 py-2 text-sm font-medium">Delete</button>
    </div>
  </div>

  <!-- Bottom tab bar -->
  <nav class="fixed inset-x-0 bottom-0 z-20 bg-slate-950/95 backdrop-blur border-t border-slate-800 pb-safe">
    <div class="max-w-md mx-auto grid grid-cols-2 h-16">
      <button @click="tab = 'upload'" class="flex flex-col items-center justify-center gap-0.5 text-xs"
              :class="tab === 'upload' ? 'text-sky-400' : 'text-slate-400'">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        Upload
      </button>
      <button @click="tab = 'gallery'" class="flex flex-col items-center justify-center gap-0.5 text-xs"
              :class="tab === 'gallery' ? 'text-sky-400' : 'text-slate-400'">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Gallery
      </button>
    </div>
  </nav>

  <!-- Lightbox -->
  <div x-show="lightbox" x-cloak x-transition.opacity @keydown.escape.window="lightbox = null"
       class="fixed inset-0 z-40 bg-black/95 flex flex-col pt-safe pb-safe" @click.self="lightbox = null">
    <div class="flex items-center justify-between p-3">
      <button @click="lightbox = null" class="px-3 py-2 text-sm text-slate-300">Close</button>
      <span class="text-xs text-slate-500 truncate mx-2" x-text="lightbox?.name"></span>
      <button @click="deletePhotos([lightbox.name])" class="rounded-xl bg-rose-600 px-4 py-2 text-sm font-medium">Delete</button>
    </div>
    <div class="flex-1 min-h-0 flex items-center justify-center p-2" @click.self="lightbox = null">
      <img :src="lightbox?.url" class="max-w-full max-h-full object-contain rounded" alt="">
    </div>
  </div>

  <!-- Toasts -->
  <div class="fixed top-16 inset-x-0 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none pt-safe">
    <template x-for="t in toasts" :key="t.id">
      <div x-transition class="pointer-events-auto max-w-sm w-full rounded-xl px-4 py-3 text-sm shadow-lg border"
           :class="{
             'bg-emerald-950 border-emerald-800 text-emerald-100': t.type === 'success',
             'bg-rose-950 border-rose-800 text-rose-100': t.type === 'error',
             'bg-slate-800 border-slate-700 text-slate-100': t.type === 'info',
           }"
           @click="toasts = toasts.filter(x => x.id !== t.id)" x-text="t.message"></div>
    </template>
  </div>

<script>
function frameDrop() {
  let nextId = 1;
  const savedMode = (() => { try { return localStorage.getItem('framedrop.mode'); } catch { return null; } })();

  return {
    tab: 'upload',
    status: { frame_reachable: null },
    mode: savedMode === 'crop' ? 'crop' : 'blur',
    dragging: false,
    queue: [],
    busy: false,
    photos: [],
    loadingPhotos: false,
    selecting: false,
    selected: [],
    syncing: false,
    immichSyncing: false,
    lightbox: null,
    toasts: [],

    init() {
      this.refreshStatus();
      setInterval(() => this.refreshStatus(), 30000);
      this.$watch('mode', v => { try { localStorage.setItem('framedrop.mode', v); } catch {} });
      this.$watch('tab', t => { if (t === 'gallery') this.loadPhotos(); });
    },

    // --- helpers -------------------------------------------------------
    toast(message, type = 'info', ms = 3500) {
      const id = nextId++;
      this.toasts.push({ id, message, type });
      setTimeout(() => { this.toasts = this.toasts.filter(t => t.id !== id); }, ms);
    },

    async api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
      return data;
    },

    async refreshStatus() {
      try { this.status = await this.api('GET', '/api/status'); }
      catch { this.status = { ...this.status, frame_reachable: false }; }
    },

    // --- upload --------------------------------------------------------
    get doneCount() {
      return this.queue.filter(q => ['done', 'saved', 'duplicate', 'error'].includes(q.state)).length;
    },

    get overallProgress() {
      if (!this.queue.length) return 0;
      const total = this.queue.reduce((sum, q) => sum + (['queued'].includes(q.state) ? 0 : q.progress), 0);
      return Math.round((total / this.queue.length) * 100);
    },

    stateIcon(state) {
      return {
        queued: '<span class="text-slate-500">•</span>',
        uploading: '<span class="inline-block w-3 h-3 rounded-full border-2 border-sky-400 border-t-transparent animate-spin"></span>',
        processing: '<span class="inline-block w-3 h-3 rounded-full border-2 border-violet-400 border-t-transparent animate-spin"></span>',
        done: '<span class="text-emerald-400">✓</span>',
        saved: '<span class="text-amber-400">!</span>',
        duplicate: '<span class="text-slate-400">=</span>',
        error: '<span class="text-rose-400">✕</span>',
      }[state];
    },

    addFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      if (!this.busy && this.queue.length && this.doneCount === this.queue.length) this.queue = [];
      for (const file of files) {
        this.queue.push({ id: nextId++, file, state: 'queued', progress: 0, message: this.formatSize(file.size) });
      }
      this.runQueue();
    },

    async runQueue() {
      if (this.busy) return;
      this.busy = true;
      let item;
      while ((item = this.queue.find(q => q.state === 'queued'))) {
        await this.uploadOne(item);
      }
      this.busy = false;

      const counts = this.queue.reduce((c, q) => (c[q.state] = (c[q.state] || 0) + 1, c), {});
      const parts = [];
      if (counts.done) parts.push(`${counts.done} sent to frame`);
      if (counts.saved) parts.push(`${counts.saved} saved (frame offline)`);
      if (counts.duplicate) parts.push(`${counts.duplicate} already there`);
      if (counts.error) parts.push(`${counts.error} failed`);
      this.toast(parts.join(' · ') || 'Nothing uploaded', counts.error || counts.saved ? 'error' : 'success', 5000);
      this.refreshStatus();
      if (this.tab === 'gallery') this.loadPhotos();
    },

    uploadOne(item) {
      return new Promise(resolve => {
        const form = new FormData();
        form.append('files', item.file, item.file.name);
        form.append('mode', this.mode);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload');
        item.state = 'uploading';
        xhr.upload.onprogress = e => { if (e.lengthComputable) item.progress = (e.loaded / e.total) * 0.85; };
        xhr.upload.onload = () => { item.state = 'processing'; item.progress = 0.9; item.message = 'Optimising & sending to frame…'; };
        xhr.onload = () => {
          item.progress = 1;
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch {}
          const r = data.results?.[0];
          if (xhr.status >= 400 || !r) {
            item.state = 'error';
            item.message = data.detail || `Upload failed (HTTP ${xhr.status})`;
          } else if (r.status === 'uploaded') {
            item.state = 'done'; item.message = 'On the frame';
          } else if (r.status === 'saved') {
            item.state = 'saved'; item.message = 'Saved — frame unreachable, use Sync / Repair later';
          } else if (r.status === 'duplicate') {
            item.state = 'duplicate'; item.message = 'Already on the frame';
          } else {
            item.state = 'error'; item.message = r.error || 'Processing failed';
          }
          resolve();
        };
        xhr.onerror = () => { item.state = 'error'; item.progress = 1; item.message = 'Network error'; resolve(); };
        xhr.send(form);
      });
    },

    formatSize(bytes) {
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    },

    // --- gallery -------------------------------------------------------
    async loadPhotos() {
      this.loadingPhotos = true;
      try {
        const data = await this.api('GET', '/api/photos');
        this.photos = data.photos;
        this.selected = this.selected.filter(n => this.photos.some(p => p.name === n));
      } catch (e) {
        this.toast(`Could not load photos: ${e.message}`, 'error');
      } finally {
        this.loadingPhotos = false;
      }
    },

    toggleSelect() {
      this.selecting = !this.selecting;
      this.selected = [];
    },

    toggle(name) {
      this.selected = this.selected.includes(name)
        ? this.selected.filter(n => n !== name)
        : [...this.selected, name];
    },

    async deletePhotos(names) {
      if (!names.length) return;
      const label = names.length === 1 ? 'this photo' : `${names.length} photos`;
      if (!confirm(`Delete ${label} from the frame?`)) return;
      try {
        const res = await this.api('POST', '/api/delete', { names });
        this.photos = this.photos.filter(p => !res.deleted.includes(p.name));
        this.selected = this.selected.filter(n => !res.deleted.includes(n));
        if (this.lightbox && res.deleted.includes(this.lightbox.name)) this.lightbox = null;
        if (!this.photos.length) this.selecting = false;
        if (res.pending_on_frame.length) {
          this.toast(`Deleted locally; ${res.pending_on_frame.length} will be removed from the frame on next Sync`, 'error', 5000);
        } else {
          this.toast(`Deleted ${res.deleted.length} ${res.deleted.length === 1 ? 'photo' : 'photos'}`, 'success');
        }
        this.refreshStatus();
      } catch (e) {
        this.toast(`Delete failed: ${e.message}`, 'error');
      }
    },

    async syncRepair() {
      this.syncing = true;
      try {
        const r = await this.api('POST', '/api/sync');
        const parts = [];
        if (r.uploaded.length) parts.push(`${r.uploaded.length} uploaded`);
        if (r.imported.length) parts.push(`${r.imported.length} imported from frame`);
        if (r.deleted.length) parts.push(`${r.deleted.length} removed`);
        if (r.thumbs_rebuilt) parts.push(`${r.thumbs_rebuilt} thumbnails rebuilt`);
        if (r.errors.length) parts.push(`${r.errors.length} errors`);
        this.toast(parts.length ? parts.join(' · ') : 'Already in sync', r.errors.length ? 'error' : 'success', 5000);
        await this.loadPhotos();
      } catch (e) {
        this.toast(`Sync failed: ${e.message}`, 'error', 5000);
      } finally {
        this.syncing = false;
        this.refreshStatus();
      }
    },

    async immichSync() {
      this.immichSyncing = true;
      try {
        const r = await this.api('POST', '/api/immich/sync');
        const parts = [];
        if (r.added.length) parts.push(`${r.added.length} added`);
        if (r.removed.length) parts.push(`${r.removed.length} removed`);
        if (r.errors.length) parts.push(`${r.errors.length} errors`);
        this.toast(parts.length ? `Immich: ${parts.join(' · ')}` : 'Immich album already in sync', r.errors.length ? 'error' : 'success', 5000);
        await this.loadPhotos();
      } catch (e) {
        this.toast(`Immich sync failed: ${e.message}`, 'error', 5000);
      } finally {
        this.immichSyncing = false;
      }
    },
  };
}
</script>
</body>
</html>
